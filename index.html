<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Gargoyles Tower Defense</title>
    <meta name="description" content="Tower Defense mit den Wasserspeiern des Freiburger Münsters.">
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
      #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #1a1a2e; outline: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
                 color: #f0e6d2; font-family: Georgia, "Times New Roman", serif; text-align: center; padding: 16px; }
      #loading h1 { margin: 0; font-size: clamp(24px, 5vw, 44px); font-weight: normal; letter-spacing: 0.02em; }
      #bar { width: min(320px, 70vw); height: 8px; border-radius: 4px; background: rgba(240, 230, 210, 0.2); overflow: hidden; }
      #bar-fill { width: 0%; height: 100%; background: #e0a050; transition: width 0.2s; }
      #hint { font-size: 14px; opacity: 0.7; font-family: system-ui, sans-serif; }
      #error { display: none; max-width: 480px; font-family: system-ui, sans-serif; font-size: 15px; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <h1>Gargoyles Tower Defense</h1>
      <div id="bar"><div id="bar-fill"></div></div>
      <div id="hint">Wird geladen …</div>
      <div id="error"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Build.data",
        frameworkUrl: buildUrl + "/Build.framework.js",
        codeUrl: buildUrl + "/Build.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "HFU",
        productName: "Gargoyles Tower Defense",
        productVersion: "1.0",
        // Volle Fenstergröße auf hochauflösenden Displays kostet viel Leistung.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
      };

      function showError(msg) {
        document.querySelector("#bar").style.display = "none";
        document.querySelector("#hint").style.display = "none";
        var e = document.querySelector("#error");
        e.textContent = "Das Spiel konnte nicht geladen werden: " + msg;
        e.style.display = "block";
      }

      var script = document.createElement("script");
      script.src = buildUrl + "/Build.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#bar-fill").style.width = (100 * progress) + "%";
        }).then(function () {
          document.querySelector("#loading").style.display = "none";
          canvas.focus();
        }).catch(showError);
      };
      script.onerror = function () { showError("Datei fehlt."); };
      document.body.appendChild(script);
    </script>
  </body>
</html>
